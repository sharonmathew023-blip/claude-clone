name: ULTRON checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check worker.js
      - name: Check inline browser scripts
        run: node tests/inline-scripts.test.mjs
      - name: Run skill engine tests
        run: node tests/skill-engine.test.mjs
      - name: Run security and fallback tests
        run: node tests/security.test.mjs
      - name: Run Worker fallback and streaming tests
        run: node --test worker.test.mjs
      - name: Run composer regression tests
        run: node --test tests/composer-regression.test.mjs
