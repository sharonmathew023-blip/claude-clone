name = "openclaude-api"
main = "worker.js"
compatibility_date = "2026-11-07"

[vars]
GOOGLE_CLIENT_ID = "299929778437-b5t5kpo1b83nmlp44aj4oerhbkl876gj.apps.googleusercontent.com"
DEFAULT_MODEL = "gemini-3.5-flash"
FALLBACK_MODELS = "gemini-3.6-flash,gemini-flash-lite-latest"

[[ratelimits]]
name = "ULTRON_USER_LIMITER"
namespace_id = "2999297784371"

[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "ULTRON_IP_LIMITER"
namespace_id = "2999297784372"

[ratelimits.simple]
limit = 30
period = 60

# Configure ULTRON_OWNER_EMAIL as a Cloudflare Worker Secret for owner-only routes.

# Remembers which models are resting after errors, so cooldowns survive restarts.
# Only model names and timestamps are stored here. No keys, tokens or chat text.
[[kv_namespaces]]
binding = "ULTRON_STATE"
id = "310ce550e35b4bcdb0863355c14907f8"

# Route outbound API work from the Worker’s optimal location.
[placement]
mode = "smart"
